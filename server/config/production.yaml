# Production configuration, used in the Docker image (docker/compose.yaml).
# Hosts, ports and secrets come from environment variables set by the compose
# file; nothing here is reachable from outside the private Docker network
# (decision 0015). Public traffic goes through the Caddy proxy.

apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

database:
  host: postgres
  port: 5432
  name: owncoffer
  user: owncoffer
  requireSsl: false

maxRequestSize: 5242880 # 5 MB: room for several years of bank statements

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: json
