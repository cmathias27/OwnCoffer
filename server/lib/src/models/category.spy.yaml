### A category of a group, optionally linked to a standard category so that
### community rules keep working after renaming or splitting.
class: Category
table: categories
fields:
  groupId: int, relation(parent=groups, onDelete=Cascade)
  parentId: int?, relation(parent=categories, onDelete=SetNull)
  ### Custom name; null = the standard category's name in the user's
  ### language (categories created from the catalogue).
  name: String?
  kind: CategoryKind
  standardCode: String?
  icon: String?
  color: String?
  ### Its operations are listed in the yearly review for the tax return.
  taxRelevant: bool, default=false
  ### Operations in this category do not count in the account's balance
  ### (e.g. deferred card settlement, decision 0051).
  excludedFromBalance: bool, default=false
  createdAt: DateTime, default=now
  deletedAt: DateTime?
indexes:
  categories_group_idx:
    fields: groupId
