### A user's choice of AI: off by default (décision 0006).
class: AiPreference
table: ai_preferences
fields:
  authUserId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
  providerId: int?, relation(parent=ai_providers, onDelete=SetNull)
  model: String?
  enabled: bool
indexes:
  ai_preferences_user_idx:
    fields: authUserId
    unique: true
