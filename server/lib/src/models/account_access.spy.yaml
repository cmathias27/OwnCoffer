### Users allowed to see a `restricted` account.
class: AccountAccess
table: account_access
fields:
  accountId: int, relation(parent=accounts, onDelete=Cascade)
  authUserId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
indexes:
  account_access_account_user_idx:
    fields: accountId, authUserId
    unique: true
