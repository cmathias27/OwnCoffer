### A group (household, association…) owning accounts, categories and rules.
class: FinanceGroup
table: groups
fields:
  name: String
  ### Optional AI (decision 0006): off by default.
  aiEnabled: bool, default=false
  ### Version of the standard catalogue its categories were last updated to
  ### (see updateStandardCategories).
  standardCatalogVersion: int, default=1
  ### Day the budget month starts (1 to 28, e.g. pay day): budget, goals and
  ### spending ranking use months from this day.
  monthStartDay: int, default=1
  ### Months checked up to this day included (decision 0050): their
  ### operations can no longer be edited by hand; bank imports still go in.
  closedUntil: DateTime?
  ### Monthly common pot, split by income (decision 0050); 0 = none.
  potMonthlyCents: int, default=0
  createdBy: UuidValue
  createdAt: DateTime, default=now
