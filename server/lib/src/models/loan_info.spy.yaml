### A loan and where it stands today.
class: LoanInfo
fields:
  loan: Loan
  ### Capital + interest of a regular instalment.
  paymentCents: int
  ### The instalment is the one debited (entered or taken from a debit),
  ### not computed: the other figures are estimates based on it.
  paymentIsActual: bool
  paidCount: int
  totalCount: int
  remainingCents: int
  principalPaidCents: int
  interestPaidCents: int
  interestRemainingCents: int
  insuranceRemainingCents: int
  ### Interest, insurance and fees over the whole loan.
  costCents: int
  repaidPerMille: int
  nextDueDate: DateTime?
  endDate: DateTime
