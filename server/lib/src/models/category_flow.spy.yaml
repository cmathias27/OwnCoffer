### Money received or spent in a category over a period, its
### sub-categories included (positive amounts; see SpendingSummary).
class: CategoryFlow
fields:
  categoryId: int
  amountCents: int
  count: int
  ### Same category over the previous period.
  previousCents: int
  ### Average over the three previous periods.
  averageCents: int
  ### Monthly goal (month view only).
  goalCents: int?
  ### Spending expected at the end of the current month, goal categories
  ### only (planned operations and the current pace).
  projectedCents: int?
  ### First day the goal should be exceeded at this pace, if it should.
  projectedOverDate: DateTime?
