### TOTP secret of a user, encrypted (SecretBox). `enabled` is false until
### the user has typed a first valid code.
class: TotpSecret
table: totp_secrets
serverOnly: true
fields:
  authUserId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
  secretBox: String
  enabled: bool, default=false
  ### Last accepted time step: a code is accepted only once.
  lastUsedStep: int?
  createdAt: DateTime, default=now
  enabledAt: DateTime?
indexes:
  totp_secrets_user_idx:
    fields: authUserId
    unique: true
