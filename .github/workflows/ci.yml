name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A version tag (v0.1.0) publishes the image ghcr.io/…/owncoffer:0.1.0.
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  SERVERPOD_VERSION: '4.0.4'

jobs:
  shared:
    name: Cœur (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatage
        run: dart format --output=none --set-exit-if-changed shared
      - name: Analyse
        run: dart analyze --fatal-infos shared
      - name: Tests
        working-directory: shared
        run: dart test

  server:
    name: Serveur
    runs-on: ubuntu-latest
    services:
      postgres_test:
        image: ghcr.io/serverpod/postgres:16
        ports:
          - 9090:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: owncoffer_test
          POSTGRES_PASSWORD: owncoffer_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throw-away values for the CI test database only.
      SERVERPOD_PASSWORD_database: owncoffer_test
      SERVERPOD_PASSWORD_serviceSecret: ci-service-secret-not-used-elsewhere
      SERVERPOD_PASSWORD_emailSecretHashPepper: ci-pepper-not-used-elsewhere-000
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: ci-jwt-key-not-used-elsewhere-00
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: ci-refresh-not-used-elsewhere-00
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Serverpod CLI
        run: |
          dart pub global activate serverpod_cli $SERVERPOD_VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Code généré à jour
        working-directory: server
        run: |
          serverpod generate
          git diff --exit-code -- . ../client
      - name: Formatage
        run: dart format --output=none --set-exit-if-changed server/lib server/test server/bin
      - name: Analyse
        run: dart analyze server client
      - name: Tests
        working-directory: server
        run: dart test

  app:
    name: Application web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyse
        working-directory: app
        run: flutter analyze
      - name: Tests
        working-directory: app
        run: |
          if compgen -G "test/**/*_test.dart" > /dev/null || compgen -G "test/*_test.dart" > /dev/null; then
            flutter test
          else
            echo "Pas encore de test de l'application."
          fi
      - name: Compilation web
        working-directory: app
        run: flutter build web --release

  vulnerabilities:
    name: Vulnérabilités connues des dépendances
    runs-on: ubuntu-latest
    # Informative for now: a flaw in a dependency must not block unrelated
    # work, but it shows in red in the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner (pubspec.lock)
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pubspec.lock

  backups:
    name: Sauvegardes et restauration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fictitious data in a throw-away database: encrypted backup, nightly
      # restore test, tampered file and wrong key refused, real restore.
      - name: Sauvegarde chiffrée, restauration testée
        run: ./tool/test_backup_restore.sh

  android:
    name: Application Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The same key for every version, so that a new APK replaces the old
      # one (decision 0020). Without these secrets: the debug key.
      - name: Clé de signature (si configurée)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z $ANDROID_KEYSTORE_BASE64 ]]; then
            echo "Pas de clé configurée : APK signé avec la clé de débogage."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/owncoffer.jks
          {
            echo "storeFile=owncoffer.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/android/key.properties
      - name: Compilation
        working-directory: app
        run: flutter build apk --release
      - name: Nom du fichier
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/owncoffer-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: owncoffer-android
          path: dist/*.apk
          retention-days: 30

  windows:
    name: Application Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Compilation
        working-directory: app
        run: flutter build windows --release
      - name: Archive
        shell: pwsh
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = "app/build/windows/x64/runner/Release"
          Copy-Item LICENSE "$release/LICENSE.txt"
          # Visual C++ runtime, as Flutter recommends for computers without it.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot/System32/$dll" $release
          }
          Compress-Archive -Path "$release/*" -DestinationPath "dist/owncoffer-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: owncoffer-windows
          path: dist/*.zip
          retention-days: 30

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [shared, server, app, backups]
    permissions:
      contents: read
      packages: write
      # Keyless signature of the published image (Sigstore, decision 0021).
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Étiquettes de l'image
        id: tags
        run: |
          image=ghcr.io/cmathias27/owncoffer
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Étiquette invalide : $GITHUB_REF_NAME" >&2
              exit 1
            fi
            printf 'list<<EOF\n%s:%s\n%s:sha-%s\nEOF\n' "$image" "$version" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            printf 'list<<EOF\n%s:edge\n%s:sha-%s\nEOF\n' "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            printf 'list<<EOF\n%s:pr\nEOF\n' "$image" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Connexion à ghcr.io
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction (publiée en :edge sur main, en :X.Y.Z sur une version)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          # Build provenance and list of components attached to the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
        if: steps.tags.outputs.push == 'true'
      - name: Signature de l'image (cosign, sans clé)
        if: steps.tags.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/cmathias27/owncoffer@$DIGEST"

  release:
    name: Publication de la version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [image, android, windows]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Only the apps: docker/build-push-action also leaves a build record
      # (*.dockerbuild) that download-artifact cannot extract.
      - uses: actions/download-artifact@v4
        with:
          pattern: owncoffer-*
          path: dist
          merge-multiple: true
      - name: Liste des composants (SBOM) du code
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/owncoffer-${{ github.ref_name }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Liste des composants (SBOM) de l'image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cmathias27/owncoffer@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: dist/owncoffer-${{ github.ref_name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
      - name: Empreintes et signatures
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
          ls -l
      - name: Notes de version (CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ---
          Image : \`ghcr.io/cmathias27/owncoffer:$version\` (signée, voir [vérifier une version](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PUBLICATION.md)).
          Applications Windows et Android non signées par un éditeur : voir [docs/APPLICATIONS.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/APPLICATIONS.md).
          EOF
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OwnCoffer ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
