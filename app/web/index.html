  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OwnCoffer — gestion de comptes bancaires auto-hébergée">
  <meta name="theme-color" content="#3346C8">
  <!-- Financial data must never be stored by the browser (decision 0011). -->

  <!-- Installable on phones (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>
  <script src="pdfjs/pdf.min.mjs" type="module"></script>
  <script type="module">
    var { pdfjsLib } = globalThis;
    if (!pdfjsLib) {
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs');
        pdfjsLib = mod.pdfjsLib || globalThis.pdfjsLib;
        if (pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
        }
      } catch (_) {}
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.mjs';
    }
    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    };
  </script>

</body>
