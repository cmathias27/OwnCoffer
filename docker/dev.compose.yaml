# Development and test databases only — not for production (see docker/compose.yaml).
# Both listen on 127.0.0.1 only. Start with:
#   docker compose -f docker/dev.compose.yaml up -d
name: owncoffer-dev

services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: owncoffer
      POSTGRES_PASSWORD: owncoffer_dev
    volumes:
      - owncoffer_dev_data:/var/lib/postgresql/data

  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: owncoffer_test
      POSTGRES_PASSWORD: owncoffer_test
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  owncoffer_dev_data:
